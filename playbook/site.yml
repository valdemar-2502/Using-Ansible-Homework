---
- name: Install Clickhouse
  hosts: clickhouse
  handlers:
    - name: Start clickhouse service
      become: true
      ansible.builtin.service:
        name: clickhouse-server
        state: restarted
  tasks:
    - name: Add clickhouse repo
      become: true
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/clickhouse.repo
        content: |
          [clickhouse-stable]
          name=ClickHouse Stable
          baseurl=https://packages.clickhouse.com/rpm/stable/
          enabled=1
          gpgcheck=0
        mode: '0644'

    - name: Install clickhouse packages
      become: true
      ansible.builtin.yum:
        name:
          - clickhouse-server
          - clickhouse-client
        state: present
        disable_gpg_check: true
      notify: Start clickhouse service

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Wait for clickhouse to start
      ansible.builtin.pause:
        seconds: 5

    - name: Create database
      ansible.builtin.command: "clickhouse-client -q 'create database logs;'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc != 82
      changed_when: create_db.rc == 0

- name: Install Vector
  hosts: vector
  become: true
  handlers:
    - name: Restart vector service
      ansible.builtin.service:
        name: vector
        state: restarted
  tasks:
    - name: Create vector directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ vector_install_dir }}"
        - "{{ vector_config_dir }}"

    - name: Get vector distrib
      ansible.builtin.get_url:
        url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-gnu.tar.gz"
        dest: "/tmp/vector-{{ vector_version }}.tar.gz"
        mode: '0644'

    - name: Unarchive vector
      ansible.builtin.unarchive:
        src: "/tmp/vector-{{ vector_version }}.tar.gz"
        dest: "{{ vector_install_dir }}"
        remote_src: true
        extra_opts: [--strip-components=1]

    - name: Create symlink for vector binary
      ansible.builtin.file:
        src: "{{ vector_install_dir }}/bin/vector"
        dest: "/usr/local/bin/vector"
        state: link
        force: true

    - name: Deploy Vector config
      ansible.builtin.template:
        src: vector.toml.j2
        dest: "{{ vector_config_dir }}/vector.toml"
        mode: '0644'
      notify: Restart vector service

    - name: Create vector systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/vector.service
        content: |
          [Unit]
          Description=Vector
          Documentation=https://vector.dev
          After=network-online.target
          Requires=network-online.target

          [Service]
          User=root
          Group=root
          ExecStart=/usr/local/bin/vector --config /etc/vector/vector.toml
          Restart=always

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Ensure vector service is running
      ansible.builtin.service:
        name: vector
        state: started
        enabled: true

    
      
- name: Install Lighthouse
  hosts: lighthouse
  become: true
  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
  tasks:
    - name: Install epel-release
      ansible.builtin.yum:
        name: epel-release
        state: present

    - name: Install nginx and git
      ansible.builtin.yum:
        name:
          - nginx
          - git
        state: present

    - name: Create lighthouse directory
      ansible.builtin.file:
        path: "{{ lighthouse_dir }}"
        state: directory
        mode: '0755'

    - name: Clone lighthouse repository
      ansible.builtin.git:
        repo: "{{ lighthouse_vcs }}"
        dest: "{{ lighthouse_dir }}"
        version: master

    - name: Deploy nginx config
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/conf.d/lighthouse.conf
        mode: '0644'
      notify: Restart nginx

    - name: Remove default nginx config
      ansible.builtin.file:
        path: /etc/nginx/conf.d/default.conf
        state: absent

    - name: Start and enable nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true